# AXIS III Raw Record Schema Definition
# Governing Document: contracts/axis3_reeb_fidelity_spec_v1.3.1.txt
# Version: 1.3.1

schema_version: "1.3.1"
record_type: "Axis3ExperimentRunRecord"

required_fields:
  # 1. Experiment & Run Identity
  - name: "run_id"
    type: "string"
    description: "Canonical collision-free unique run identifier"
  - name: "timestamp"
    type: "string"
    description: "ISO 8601 UTC timestamp of execution"
  - name: "run_class"
    type: "string"
    enum: ["confirmatory", "exploratory", "debugging_pilot"]
    description: "Class of execution; confirmatory required for science"
  - name: "experiment_id"
    type: "string"
    description: "Experiment identifier (e.g. III-1_Circle_Conventional_Baseline, III-2A_Circle_Cover_Landscape)"
  - name: "experiment_family"
    type: "string"
    description: "Axis III subprogram (III-0, III-1, III-2, III-3, III-4, III-5)"
  - name: "dataset_id"
    type: "string"
    description: "Synthetic dataset identifier (e.g. unit_circle_S1, branching_tripod_Y)"
  - name: "dataset_replication_id"
    type: "integer"
    description: "Replication index (0 for baseline)"
  - name: "sample_size"
    type: "integer"
    description: "Realized observation count N"
  - name: "method_id"
    type: "string"
    enum: ["conventional", "f_mapper", "ensemble_kang_lim", "ball_mapper"]
    description: "Evaluated Mapper method identifier"
  - name: "output_variant"
    type: "string"
    description: "Output representation (e.g. standard, dual_homology)"

  # 1B. III-2 Cover-Resolution & Sampling-Density Grid Context (Nullable/Optional for Historical III-1)
  - name: "planned_unit_id"
    type: "string_or_null"
    description: "Immutable identifier of planned experimental unit from AXIS3_III2_PLANNED_UNIT_LEDGER.csv"
  - name: "axis3_subexperiment"
    type: "string_or_null"
    enum: ["III-2A", "III-2B", null]
    description: "Axis-III III-2 subprogram stage (III-2A or III-2B)"
  - name: "cover_cell_id"
    type: "string_or_null"
    description: "Canonical cover cell identifier (e.g. L05_P010, L10_P030)"
  - name: "n_intervals"
    type: "integer_or_null"
    description: "Number of intervals in Mapper cover"
  - name: "overlap_frac"
    type: "float_or_null"
    description: "Fractional overlap between adjacent intervals in [0.0, 1.0)"
  - name: "n_covered_samples"
    type: "integer_or_null"
    description: "Count of observed sample points belonging to at least one constructed Mapper node"
  - name: "n_uncovered_samples"
    type: "integer_or_null"
    description: "Count of observed sample points not assigned to any Mapper node (N - n_covered_samples)"
  - name: "coverage_fraction"
    type: "float_or_null"
    description: "Diagnostic coverage ratio n_covered_samples / sample_size"
  - name: "evidence_origin"
    type: "string_or_null"
    enum: ["sealed_III1_anchor", "III2A_new_confirmatory", "III2B_new_confirmatory", null]
    description: "Provenance of evidence (sealed historical anchor or newly executed confirmatory unit)"
  - name: "dataset_realization_sha256"
    type: "string_or_null"
    description: "Deterministic SHA-256 hash of realized coordinate point array"

  # 2. Filter & Same-Filter Contract
  - name: "lens_id"
    type: "string"
    description: "Mapper scalar lens identifier"
  - name: "reference_filter_id"
    type: "string"
    description: "Continuous reference scalar filter identifier"
  - name: "mapper_filter_id"
    type: "string"
    description: "Mapper executed scalar filter identifier"
  - name: "reference_filter_definition_hash"
    type: "string"
    description: "SHA-256 hash of canonical reference filter definition"
  - name: "mapper_filter_definition_hash"
    type: "string"
    description: "SHA-256 hash of canonical mapper filter definition"
  - name: "same_filter_contract"
    type: "boolean"
    description: "True iff mapper_filter_id == reference_filter_id and definition hashes match"
  - name: "strict_confirmatory"
    type: "boolean"
    description: "True iff executed in strict confirmatory verification mode"

  # 3. Reference Object Provenance
  - name: "reference_object_id"
    type: "string"
    description: "Identifier of evaluated Reeb reference"
  - name: "reference_type"
    type: "string"
    enum: ["exact_continuous", "exact_PL", "numerical_reference", "mapper_proxy_sanity_check"]
    description: "Category of Reeb reference"
  - name: "reference_version"
    type: "string"
    description: "Specification version of Reeb reference"
  - name: "reference_hash"
    type: "string"
    description: "SHA-256 hash of reference object representation"

  # 4. Method Parameters & Seeds
  - name: "parameter_configuration_id"
    type: "string"
    description: "Identifier of parameter preset (e.g. a_priori_fixed)"
  - name: "method_parameters"
    type: "mapping"
    description: "Complete dictionary of method hyperparameter values"
  - name: "data_seed"
    type: "integer"
    description: "Deterministic sample generation seed"
  - name: "construction_seed"
    type: "integer"
    description: "Deterministic method construction seed"
  - name: "evaluation_seed"
    type: "integer"
    description: "Deterministic evaluation / bootstrap seed"

  # 5. Status & Failure Accounting
  - name: "status"
    type: "string"
    enum: ["success", "same_filter_contract_violation", "same_filter_contract_unverifiable", "reference_unavailable", "reference_failure", "mapper_construction_failure", "mapper_filtration_failure", "extended_persistence_failure", "homology_resource_failure", "homology_computation_failure", "configuration_invalid", "metric_undefined"]
    description: "Execution outcome status"
  - name: "failure_reason"
    type: "string_or_null"
    description: "Detailed error message or failure diagnostic"

  # 6. Topological & Structural Invariants (Tier A)
  - name: "n_nodes"
    type: "integer_or_null"
    description: "Vertex count of Mapper 1-skeleton"
  - name: "n_edges"
    type: "integer_or_null"
    description: "Edge count of Mapper 1-skeleton"
  - name: "n_components"
    type: "integer_or_null"
    description: "Connected component count of Mapper graph"
  - name: "n_2_simplices"
    type: "integer_or_null"
    description: "2-simplex count of simplicial membership nerve"
  - name: "beta0_graph_mapper"
    type: "integer_or_null"
    description: "0-th Betti number of Mapper graph (component count)"
  - name: "beta1_graph_mapper"
    type: "integer_or_null"
    description: "1-skeleton cycle rank E - V + C of Mapper graph"
  - name: "beta0_nerve_mapper"
    type: "integer_or_null"
    description: "0-th Betti number of simplicial membership nerve"
  - name: "beta1_nerve_mapper"
    type: "integer_or_null"
    description: "1-st Betti number dim H_1(N^(2); F_2) of membership nerve"
  - name: "beta0_reeb_reference"
    type: "integer"
    description: "True 0-th Betti number of Reeb reference"
  - name: "beta1_reeb_reference"
    type: "integer"
    description: "True 1-st Betti number of Reeb reference"
  - name: "delta_beta1_graph"
    type: "integer_or_null"
    description: "Absolute difference |beta1_graph_mapper - beta1_reeb_reference|"
  - name: "delta_beta1_nerve_to_reference"
    type: "integer_or_null"
    description: "Absolute difference |beta1_nerve_mapper - beta1_reeb_reference|"

  # 6B. Mapper-Graph Branching Diagnostics Relative to Exact PL Reference (Tier A Branching)
  - name: "n_leaves_mapper"
    type: "integer_or_null"
    description: "Count of Mapper graph vertices with degree == 1 (nullable/optional for non-branching references)"
  - name: "n_branch_vertices_mapper"
    type: "integer_or_null"
    description: "Count of Mapper graph vertices with degree >= 3 (nullable/optional for non-branching references)"
  - name: "n_leaves_reeb_reference"
    type: "integer_or_null"
    description: "Count of Reeb reference vertices with degree == 1 (nullable/optional for non-branching references)"
  - name: "n_branch_vertices_reeb_reference"
    type: "integer_or_null"
    description: "Count of Reeb reference vertices with degree >= 3 (nullable/optional for non-branching references)"
  - name: "delta_leaves"
    type: "integer_or_null"
    description: "Absolute difference |n_leaves_mapper - n_leaves_reeb_reference|"
  - name: "delta_branch_vertices"
    type: "integer_or_null"
    description: "Absolute difference |n_branch_vertices_mapper - n_branch_vertices_reeb_reference|"
  - name: "non_degree2_signature_mapper"
    type: "list_or_null"
    description: "Sorted non-degree-2 vertex degree sequence of Mapper graph"
  - name: "non_degree2_signature_reference"
    type: "list_or_null"
    description: "Sorted non-degree-2 vertex degree sequence of Reeb reference"

  # 7. Typed Extended-Persistence Metrics (Tier B)
  - name: "ord0_bottleneck"
    type: "float_or_null"
    description: "Bottleneck distance on Ord_0 subdiagram"
  - name: "rel1_bottleneck"
    type: "float_or_null"
    description: "Bottleneck distance on Rel_1 subdiagram"
  - name: "ext0plus_bottleneck"
    type: "float_or_null"
    description: "Bottleneck distance on Ext_0+ subdiagram"
  - name: "ext1minus_bottleneck"
    type: "float_or_null"
    description: "Bottleneck distance on Ext_1- subdiagram"
  - name: "type_restricted_bottleneck_distance"
    type: "float_or_null"
    description: "Overall type-restricted bottleneck distance max_k d_B(M[k], R[k])"
  - name: "type_restricted_wasserstein_distance"
    type: "float_or_null"
    description: "Overall type-restricted 1-Wasserstein distance sum_k W_1(M[k], R[k])"

  # 8. Provenance, Runtime & Eligibility
  - name: "runtime_seconds"
    type: "float"
    description: "Total wall time in seconds"
  - name: "cpu_time_seconds"
    type: "float"
    description: "Total CPU time in seconds"
  - name: "peak_memory_bytes"
    type: "integer"
    description: "Peak memory usage in bytes"
  - name: "source_commit"
    type: "string"
    description: "Git commit hash of running codebase"
  - name: "source_hashes"
    type: "mapping"
    description: "SHA-256 digests of key pipeline source modules"
  - name: "scientific_evidence_eligible"
    type: "boolean"
    description: "True iff run satisfies all scientific confirmatory criteria"
  - name: "notes"
    type: "string_or_null"
    description: "Optional audit or diagnostic commentary"
