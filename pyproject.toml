[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "three-axis-mapper-framework"
version = "3.0.0"
description = "Algorithms and verification tools for Mapper evaluation experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.11.4",
  "scikit-learn==1.9.0",
  "matplotlib==3.8.4",
  "gudhi==3.13.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
